<!-- templates/reclamations/dashboard/_avec_8d_list.html -->
{% for rec in reclamations_avec_8d %}
<div class="reclamation-item">
    <div>
        <div class="reclamation-num">{{ rec.numero_reclamation }}</div>
        <div class="reclamation-client">{{ rec.client.nom }}</div>
    </div>
    <div class="text-end">
        <div class="reclamation-date">Pilote: {{ rec.huitd.pilote|default:"-" }}</div>
        <span class="badge-8d">{{ rec.huitd.get_etat_display }}</span>
    </div>
</div>
{% empty %}
<div style="text-align:center; padding:20px; color:#666;">Aucun 8D en cours</div>
{% endfor %}
