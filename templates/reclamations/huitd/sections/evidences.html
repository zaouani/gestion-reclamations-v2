<!-- templates/reclamations/huitd/sections/evidences.html -->
<div class="tab-pane fade" id="tab-evidences">
    <div class="card">
        <div class="card-header bg-secondary text-white">
            <h5 class="mb-0">📎 Évidences / Pièces jointes</h5>
        </div>
        <div class="card-body">
            {% for ev in huitd.evidences.all %}
            <div class="d-flex align-items-center mb-2 p-2 border rounded">
                <i class="fas fa-paperclip text-muted me-3"></i>
                <div class="flex-grow-1">
                    <strong>{{ ev.titre }}</strong>
                    {% if ev.description %}<br><small>{{ ev.description }}</small>{% endif %}
                    <br><small class="text-muted">Ajouté le {{ ev.date_ajout|date:"d/m/Y H:i" }}</small>
                </div>
                <a href="{{ ev.fichier.url }}" class="btn btn-sm btn-outline-primary" target="_blank">
                    <i class="fas fa-download"></i>
                </a>
            </div>
            {% empty %}
            <p class="text-muted">Aucune évidence</p>
            {% endfor %}
        </div>
    </div>
</div>
