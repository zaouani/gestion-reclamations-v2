<!-- templates/reclamations/huitd/sections/facteur_humain.html -->
<div class="tab-pane fade" id="tab-fh">
    <div class="card">
        <div class="card-header" style="background-color:#8e44ad;color:white;">
            <h5 class="mb-0">👤 Facteur Humain</h5>
        </div>
        <div class="card-body">
            {% if huitd.facteur_humain %}
            <div class="row">
                <div class="col-12 mb-3">
                    <label class="fw-bold">Description / Contexte :</label>
                    <div class="border rounded p-3 bg-light">
                        {{ huitd.facteur_humain.description|default:"-"|linebreaksbr }}
                    </div>
                </div>
                <div class="col-12 mb-3">
                    <label class="fw-bold">Analyse :</label>
                    <div class="border rounded p-3 bg-light">
                        {{ huitd.facteur_humain.analyse|default:"-"|linebreaksbr }}
                    </div>
                </div>
                <div class="col-12">
                    <label class="fw-bold">Actions liées au facteur humain :</label>
                    <div class="border rounded p-3 bg-light">
                        {{ huitd.facteur_humain.actions|default:"-"|linebreaksbr }}
                    </div>
                </div>
            </div>
            {% else %}
            <p class="text-muted text-center py-3">Aucune analyse du facteur humain</p>
            {% endif %}
        </div>
    </div>
</div>
