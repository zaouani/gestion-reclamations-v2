<!-- templates/reclamations/huitd/sections/d1_equipe.html -->
<div class="tab-pane fade" id="tab-d1">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">👥 D1 - Équipe 8D</h5>
        </div>
        <div class="card-body">
            <div class="row mb-4">
                <div class="col-md-6">
                    <label class="fw-bold">Pilote :</label>
                    <p>{{ huitd.pilote|default:"-" }}</p>
                </div>
                <div class="col-md-6">
                    <label class="fw-bold">Animateur :</label>
                    <p>{{ huitd.animateur|default:"-" }}</p>
                </div>
            </div>
            
            <h6 class="fw-bold">Participants</h6>
            <table class="table table-bordered table-sm">
                <thead class="table-light">
                    <tr>
                        <th>Rôle</th>
                        <th>Nom</th>
                        <th>Fonction</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in huitd.participants.all %}
                    <tr>
                        <td>{{ p.role }}</td>
                        <td>{{ p.nom }}</td>
                        <td>{{ p.fonction }}</td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="3" class="text-muted">Aucun participant</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
