<!-- templates/reclamations/huitd/modals/vrs.html -->
<div class="method-modal" id="modal-vrs">
    <div class="method-modal-content" style="max-width:1100px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>✅ Verification of Standards (VRS)</h4>
            <button type="button" class="btn-close" onclick="fermerMethode('vrs')"></button>
        </div>
        
        <form method="post" action="{% url 'reclamations:huitd_modifier' huitd.id %}">
            {% csrf_token %}
            <input type="hidden" name="section" value="vrs">
            
            <table class="table table-bordered table-sm mb-3">
                <tr><th width="30%">Designation</th><td><input type="text" name="vrs_designation" class="form-control form-control-sm" value="{{ huitd.vrs.designation }}"></td></tr>
                <tr><th>Nom / Name</th><td><input type="text" name="vrs_nom" class="form-control form-control-sm" value="{{ huitd.vrs.nom }}"></td></tr>
                <tr><th>Site</th><td><input type="text" name="vrs_site" class="form-control form-control-sm" value="{{ huitd.vrs.site }}"></td></tr>
                <tr><th>Date</th><td><input type="date" name="vrs_date" class="form-control form-control-sm" value="{{ huitd.vrs.date|date:'Y-m-d' }}"></td></tr>
                <tr><th>Suivant</th><td><input type="text" class="form-control form-control-sm" value="{{ huitd.vrs.suivi|default:'PR-SM-06' }}" disabled></td></tr>
            </table>
            
            <div class="table-responsive">
                <table class="table table-bordered table-sm">
                    <thead class="table-light">
                        <tr>
                            <th>6M</th><th>Facteur probable</th><th>Paramètre mesurable</th><th>Standard</th>
                            <th>Données bonnes</th><th>Données mauvaises</th>
                            <th>Suivi?</th><th>Approprié?</th><th>Lien?</th><th>Prouvé?</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for f in huitd.vrs.facteurs.all %}
                        <tr>
                            <td><strong>{{ f.get_categorie_display }}</strong></td>
                            <td><textarea name="vrs_facteur_{{ f.categorie }}" class="form-control form-control-sm" rows="1">{{ f.facteur_probable }}</textarea></td>
                            <td><textarea name="vrs_parametre_{{ f.categorie }}" class="form-control form-control-sm" rows="1">{{ f.parametre_mesurable }}</textarea></td>
                            <td><textarea name="vrs_standard_{{ f.categorie }}" class="form-control form-control-sm" rows="1">{{ f.standard_exigence }}</textarea></td>
                            <td><textarea name="vrs_bonnes_{{ f.categorie }}" class="form-control form-control-sm" rows="1">{{ f.donnees_bonnes }}</textarea></td>
                            <td><textarea name="vrs_mauvaises_{{ f.categorie }}" class="form-control form-control-sm" rows="1">{{ f.donnees_mauvaises }}</textarea></td>
                            <td class="text-center"><input type="checkbox" name="vrs_suivi_{{ f.categorie }}" {% if f.standard_suivi %}checked{% endif %}></td>
                            <td class="text-center"><input type="checkbox" name="vrs_appro_{{ f.categorie }}" {% if f.standard_approprie %}checked{% endif %}></td>
                            <td class="text-center"><input type="checkbox" name="vrs_lien_{{ f.categorie }}" {% if f.lien_prouve %}checked{% endif %}></td>
                            <td class="text-center"><input type="checkbox" name="vrs_prouve_{{ f.categorie }}" {% if f.facteur_prouve %}checked{% endif %}></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            
            <div class="text-end mt-3">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Enregistrer VRS</button>
            </div>
        </form>
    </div>
</div>
